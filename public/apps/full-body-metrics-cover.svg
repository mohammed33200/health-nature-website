  <rect x="780" y="465" width="220" height="22" rx="11" fill="#34d399" />
  <text x="780" y="520" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="600">Fat % 21</text>
  <text x="780" y="550" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="600">Muscle 37%</text>
  <text x="780" y="580" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="600">Water 61%</text>
  <rect x="180" y="610" width="820" height="38" rx="18" fill="#ffffff" opacity="0.7" />
  <text x="210" y="636" fill="#0f172a" font-family="Inter, sans-serif" font-size="18">تحليل كامل للجسم بدقة علمية</text>
