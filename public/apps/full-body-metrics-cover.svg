<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Full Body Metrics App Illustration</title>
  <desc id="desc">Illustration showing body metrics dashboard for a fitness health landing page.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2f6f5" />
    </linearGradient>
  </defs>
  <rect width="1200" height="680" rx="40" fill="url(#bgGrad)" />
  <rect x="80" y="80" width="520" height="500" rx="40" fill="url(#cardGrad)" stroke="#d1fae5" stroke-width="6" />
  <rect x="140" y="140" width="400" height="60" rx="18" fill="#0f172a" />
  <text x="160" y="185" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="700">Full Body Metrics</text>
  <rect x="120" y="240" width="360" height="26" rx="12" fill="#22c55e" />
  <rect x="120" y="292" width="260" height="26" rx="12" fill="#38bdf8" />
  <rect x="120" y="344" width="320" height="26" rx="12" fill="#f59e0b" />
  <rect x="120" y="396" width="180" height="26" rx="12" fill="#a855f7" />
  <circle cx="420" cy="500" r="56" fill="#22c55e" opacity="0.15" />
  <circle cx="350" cy="500" r="90" fill="#ffffff" opacity="0.15" />
  <rect x="720" y="160" width="360" height="420" rx="36" fill="#0f172a" opacity="0.85" />
  <rect x="760" y="200" width="280" height="70" rx="20" fill="#22c55e" />
  <text x="780" y="245" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="700">Body Score</text>
